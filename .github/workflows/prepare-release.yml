name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix, for example 0.5.0
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare v${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"

      - name: Validate release request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Release preparation must run from $DEFAULT_BRANCH, not $GITHUB_REF_NAME." >&2
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be a stable semantic version such as 0.5.0." >&2
            exit 1
          fi

          if git rev-parse --verify "refs/tags/v$VERSION" >/dev/null 2>&1 || \
             git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists." >&2
            exit 1
          fi

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "The checked-out source tree is not clean." >&2
            exit 1
          fi

      - name: Update package versions
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          for manifest in lanx-core/Cargo.toml lanx-net/Cargo.toml lanx-cli/Cargo.toml; do
            sed -i -E "0,/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"$/s//version = \"$VERSION\"/" "$manifest"
          done

          cargo update --workspace

          python3 - "$VERSION" <<'PY'
          import json
          import subprocess
          import sys

          expected = sys.argv[1]
          metadata = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--no-deps", "--format-version", "1"],
                  text=True,
              )
          )
          workspace_versions = {
              package["name"]: package["version"]
              for package in metadata["packages"]
              if package["source"] is None
          }
          mismatches = {
              name: version
              for name, version in workspace_versions.items()
              if version != expected
          }
          if mismatches:
              raise SystemExit(f"Workspace version mismatch: {mismatches}")
          PY

      - name: Test release state
        run: cargo test --workspace --locked

      - name: Commit version bump
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lanx-core/Cargo.toml lanx-net/Cargo.toml lanx-cli/Cargo.toml Cargo.lock
          git diff --cached --check
          git commit -m "chore(release): bump version to v$VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Create release tag
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Start release build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh workflow run release.yml --ref "v$VERSION"
