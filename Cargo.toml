[workspace]
resolver = "2"
members = [
    "lanx-core",
    "lanx-net",
    "lanx-cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.40", features = ["net", "io-util", "time", "rt-multi-thread", "fs", "sync", "macros", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.0", features = ["alloc"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
indicatif = "0.17"
console = "0.15"
blake3 = { version = "1.5", features = ["rayon", "std"] }
rand = "0.8"
tempfile = "3.10"
if-addrs = "0.14"
zip = { version = "2", default-features = false, features = ["deflate"] }
snow = { version = "0.9", default-features = false, features = ["default-resolver"] }
unicode-normalization = "0.1"
lanx-core = { path = "lanx-core" }
lanx-net = { path = "lanx-net" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Dev: dependencies get light optimization only. lanx does real work under
# `cargo test` and `cargo run` (ChaCha20 through snow, deflate through zip,
# BLAKE3 over real files), and opt-level 1 keeps that work fast while
# workspace crates stay in the fast, fully instrumented debug mode.
[profile.dev.package."*"]
opt-level = 1

# Line tables are enough for panic backtraces; smaller debug info keeps
# dev builds and links fast.
[profile.dev]
debug = "line-tables-only"
