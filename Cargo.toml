[workspace]
resolver = "2"
members = [
    "lanx-core",
    "lanx-net",
    "lanx-cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.40", features = ["net", "io-util", "time", "rt-multi-thread", "fs", "sync", "macros", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.0", features = ["alloc"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
console = "0.15"
blake3 = { version = "1.5", features = ["rayon", "std"] }
rand = "0.8"
tempfile = "3.10"
if-addrs = "0.14"
zip = { version = "2", default-features = false, features = ["deflate"] }
snow = { version = "0.9", default-features = false, features = ["default-resolver"] }
lanx-core = { path = "lanx-core" }
lanx-net = { path = "lanx-net" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
